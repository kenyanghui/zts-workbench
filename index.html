<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>中通服项目评审工作台 · 财政评审</title>
<style>

  :root{
    --bg:#edf1f5;
    --panel:#ffffff;
    --panel-2:#f7fafc;
    --panel-3:#fbfcfd;
    --ink:#152a3b;
    --ink-2:#2d4559;
    --muted:#66798b;
    --muted-2:#8797a6;
    --line:#d8e2ea;
    --line-2:#e8eef3;
    --navy:#1c3f5c;
    --blue:#2c6a96;
    --blue-2:#3d80ad;
    --blue-soft:#e9f2f8;
    --teal:#2c6b5f;
    --red:#a23f32;
    --red-soft:#faeeeb;
    --amber:#8a5f08;
    --amber-soft:#fbf4e2;
    --green:#2f6b4f;
    --green-soft:#eaf4ee;
    --violet:#5a4c8a;
    --violet-soft:#efedf7;
    --shadow:0 1px 2px rgba(20,40,60,.04),0 4px 14px rgba(20,40,60,.035);
    --shadow-strong:0 12px 34px rgba(20,40,60,.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    font-size:13px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select{font:inherit;}
  button{cursor:pointer;}
  a{color:var(--blue);text-decoration:none;}
  a:hover{text-decoration:underline;}
  h1,h2,h3,h4{margin:0;font-weight:700;color:var(--ink);}
  p{margin:0;}
  [hidden]{display:none !important;}
  ::selection{background:#cfe3f2;}

  .app{display:flex;min-height:100vh;}
  .sidebar{
    width:248px;flex:0 0 248px;background:#fbfcfd;border-right:1px solid var(--line);
    padding:18px 14px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:14px;z-index:10;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .brand-mark{
    width:34px;height:34px;flex:0 0 34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(145deg,#1c3f5c,#2f6f9f);color:#fff;font-weight:700;font-size:15px;
    box-shadow:0 2px 7px rgba(28,63,92,.24);
  }
  .brand strong{display:block;font-size:14px;line-height:1.3;letter-spacing:.2px;white-space:nowrap;}
  .brand small{display:block;color:var(--muted);font-size:10.5px;line-height:1.35;margin-top:2px;}
  .batch-card{
    border:1px solid var(--line);background:#fff;border-radius:7px;padding:9px 10px 8px;
    border-left:3px solid var(--blue);box-shadow:var(--shadow);
  }
  .batch-card .kicker{font-size:9.5px;}
  .batch-card strong{display:block;font-size:11.5px;line-height:1.45;color:var(--ink);margin:2px 0 3px;font-weight:600;}
  .batch-card em{display:block;font-style:normal;color:var(--blue);font-size:10.5px;line-height:1.4;}
  .nav{display:flex;flex-direction:column;gap:2px;}
  .nav-item{
    display:flex;align-items:center;gap:9px;width:100%;border:0;border-left:3px solid transparent;
    background:transparent;color:var(--ink-2);padding:7px 9px;text-align:left;font-size:12.5px;border-radius:6px;
    transition:background .14s ease,color .14s ease;
  }
  .nav-item svg{width:16px;height:16px;flex:0 0 16px;color:var(--muted);}
  .nav-item:hover{background:#eef3f7;color:var(--ink);}
  .nav-item.active{background:var(--blue-soft);border-left-color:var(--blue);color:var(--navy);font-weight:700;}
  .nav-item.active svg{color:var(--blue);}
  .nav-count{
    margin-left:auto;min-width:19px;padding:0 5px;text-align:center;border-radius:9px;
    background:#e3ebf2;color:var(--blue);font-size:10px;line-height:17px;font-weight:700;
  }
  .nav-item.active .nav-count{background:var(--blue);color:#fff;}
  .sidebar-note{color:var(--muted);font-size:10.6px;line-height:1.55;border-top:1px solid var(--line);padding-top:10px;margin-top:auto;}
  .sidebar-footer{color:var(--muted-2);font-size:10.3px;line-height:1.45;}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);
    border-bottom:1px solid var(--line);backdrop-filter:blur(8px);
  }
  .topbar-inner{max-width:1400px;margin:0 auto;padding:9px 22px;display:flex;align-items:center;gap:10px;}
  .crumbs{font-size:11.5px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .crumbs b{color:var(--ink);font-weight:600;}
  .top-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end;}
  .search{position:relative;width:292px;}
  .search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--muted);pointer-events:none;}
  .search input{
    width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:6px 9px 6px 28px;border-radius:6px;outline:none;font-size:12px;
  }
  .search input:focus{border-color:var(--blue-2);box-shadow:0 0 0 3px var(--blue-soft);}
  .search-results{
    position:absolute;top:calc(100% + 5px);left:0;right:0;z-index:40;background:#fff;
    border:1px solid var(--line);border-radius:6px;max-height:360px;overflow:auto;box-shadow:var(--shadow-strong);
  }
  .search-result{
    display:block;width:100%;border:0;border-bottom:1px solid var(--line-2);background:#fff;
    text-align:left;padding:7px 9px;color:var(--ink-2);font-size:11.5px;line-height:1.4;
  }
  .search-result:last-child{border-bottom:0;}
  .search-result:hover{background:var(--panel-2);}
  .search-result small{display:block;color:var(--muted);font-size:10.5px;margin-top:1px;}
  .search-empty{padding:10px;color:var(--muted);font-size:11px;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:5px;
    border:1px solid var(--line);background:#fff;color:var(--ink-2);
    padding:5px 9px;border-radius:5px;font-size:11.5px;line-height:1.45;white-space:nowrap;
    transition:background .14s ease,border-color .14s ease,color .14s ease;
  }
  .btn:hover{background:var(--panel-2);border-color:#bdcbd8;color:var(--ink);}
  .btn:focus-visible{outline:2px solid var(--blue-2);outline-offset:1px;}
  .btn-primary{background:var(--navy);border-color:var(--navy);color:#fff;}
  .btn-primary:hover{background:#15354f;border-color:#15354f;color:#fff;}
  .btn-ghost{color:var(--blue);border-color:#c8d8e6;background:#fff;}
  .btn-ghost:hover{background:var(--blue-soft);}
  .btn-sm{padding:3px 7px;font-size:10.8px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .demo-pill{
    display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border:1px solid #d6b57c;
    background:var(--amber-soft);color:var(--amber);font-size:10.5px;line-height:1.5;border-radius:4px;
  }

  .view{max-width:1400px;width:100%;margin:0 auto;padding:20px 22px 40px;}
  .page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:12px;}
  .page-head h1{font-size:23px;line-height:1.3;letter-spacing:.1px;}
  .page-head .sub{color:var(--muted);font-size:12px;margin-top:3px;}
  .page-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .kicker{display:block;font-size:9.8px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted-2);font-weight:700;line-height:1.4;}
  .section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:16px 0 9px;}
  .section-head h2{font-size:14.5px;letter-spacing:.1px;}
  .section-head .hint{font-size:10.8px;color:var(--muted);}

  .batch-strip{
    display:grid;grid-template-columns:1.4fr .8fr .9fr auto;gap:12px;align-items:center;
    background:#fff;border:1px solid var(--line);border-radius:7px;padding:9px 12px;margin:11px 0 12px;
    box-shadow:var(--shadow);
  }
  .batch-strip > div > span{display:block;font-size:9.8px;letter-spacing:.08em;color:var(--muted-2);text-transform:uppercase;}
  .batch-strip > div > strong{display:block;font-size:11.5px;color:var(--ink);font-weight:600;line-height:1.4;margin-top:1px;}
  .batch-strip .strip-note{font-size:10.5px;color:var(--muted);border-left:1px solid var(--line);padding-left:12px;white-space:nowrap;}

  .kpi-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:10px 0 14px;}
  .kpi{
    position:relative;background:#fff;border:1px solid var(--line);border-radius:7px;padding:10px 11px 9px;
    min-height:76px;overflow:hidden;box-shadow:var(--shadow);
  }
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue);}
  .kpi.tone-warn::before{background:var(--red);}
  .kpi.tone-amber::before{background:var(--amber);}
  .kpi.tone-green::before{background:var(--green);}
  .kpi span{display:block;color:var(--muted);font-size:10.5px;}
  .kpi strong{display:block;font-size:24px;line-height:1.12;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0 1px;}
  .kpi small{display:block;color:var(--muted-2);font-size:10.2px;line-height:1.35;}
  .kpi[data-go]{cursor:pointer;}
  .kpi[data-go]:hover{border-color:#b8c9d8;background:#fbfdfe;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:13px 15px 14px;margin-bottom:12px;box-shadow:var(--shadow);}
  .panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:9px;}
  .panel-head h2{font-size:13.8px;letter-spacing:.1px;}
  .panel-head .hint{color:var(--muted-2);font-size:10.5px;font-weight:400;}
  .grid-3{display:grid;grid-template-columns:1.05fr 1fr 1.25fr;gap:10px;margin-bottom:12px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  .grid-3 .panel,.grid-2 .panel{margin-bottom:0;}

  .project-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px;}
  .project-card{
    background:#fff;border:1px solid var(--line);border-top:3px solid var(--blue-2);border-radius:7px;
    padding:12px 13px 11px;display:flex;flex-direction:column;gap:8px;min-width:0;cursor:pointer;
    box-shadow:var(--shadow);transition:border-color .15s ease,box-shadow .15s ease,transform .15s ease;
  }
  .project-card:hover{border-color:#b8c9d8;box-shadow:0 3px 12px rgba(31,61,89,.08);transform:translateY(-1px);}
  .project-card:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
  .project-card.accent-high{border-top-color:var(--red);}
  .project-card.accent-mid{border-top-color:#b07a16;}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .project-code{display:block;color:var(--muted);font-size:9.8px;letter-spacing:.12px;margin-bottom:2px;}
  .project-card h3{font-size:13.5px;line-height:1.4;margin:0 0 2px;}
  .applicant{color:var(--muted);font-size:11px;line-height:1.4;margin:0;}
  .card-meta{display:grid;grid-template-columns:1fr 1fr;gap:5px 9px;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:7px 0;}
  .card-meta > div > span{display:block;color:var(--muted);font-size:9.9px;}
  .card-meta > div > strong{display:block;color:var(--ink);font-size:11.4px;font-weight:600;margin-top:1px;}
  .card-foot{margin-top:auto;padding-top:7px;border-top:1px solid var(--line-2);color:var(--blue);font-size:10.8px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .card-foot span:first-child{flex:1;min-width:0;color:var(--muted);line-height:1.45;}
  .card-foot span:last-child{white-space:nowrap;flex:0 0 auto;}

  .badge{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;padding:1px 7px;border-radius:999px;font-size:10.3px;font-weight:600;line-height:1.6;border:1px solid transparent;}
  .tone-blue{color:var(--blue);background:var(--blue-soft);border-color:#c9d9e7;}
  .tone-slate{color:#4c6072;background:#e9eef3;border-color:#d2dce5;}
  .tone-amber{color:var(--amber);background:var(--amber-soft);border-color:#ead9b5;}
  .tone-red{color:var(--red);background:var(--red-soft);border-color:#eccfc8;}
  .tone-green{color:var(--green);background:var(--green-soft);border-color:#cfe3d8;}
  .tone-violet{color:var(--violet);background:var(--violet-soft);border-color:#d9d4ea;}

  .rail{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;margin:2px 0 0;}
  .rail-step{position:relative;text-align:center;min-width:0;padding-top:1px;}
  .rail-step::before{content:"";position:absolute;top:5px;left:0;right:0;height:2px;background:var(--line-2);}
  .rail-step:first-child::before{left:50%;}
  .rail-step:last-child::before{right:50%;}
  .rail-step.done::before{background:#9fc2da;}
  .rail-dot{position:relative;z-index:1;width:9px;height:9px;border-radius:50%;display:block;margin:0 auto 3px;background:#c3cfda;box-shadow:0 0 0 2px #fff;}
  .rail-step.done .rail-dot{background:var(--blue-2);}
  .rail-step.current .rail-dot{background:#fff;border:2px solid var(--blue);box-shadow:0 0 0 2px var(--blue-soft);margin-top:-1px;margin-bottom:2px;}
  .rail-step.draft .rail-dot{background:#fff;border:1.5px dashed var(--amber);}
  .rail-label{display:block;font-size:8.8px;color:var(--muted);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rail-step.done .rail-label{color:var(--ink-2);}
  .rail-step.current .rail-label{color:var(--blue);font-weight:700;}

  .riskRows{display:flex;flex-direction:column;gap:7px;margin-top:3px;}
  .riskRow{display:grid;grid-template-columns:56px 1fr 28px;align-items:center;gap:8px;}
  .riskLabel{font-size:10.8px;color:var(--ink-2);}
  .riskBar{height:7px;background:var(--line-2);border-radius:4px;overflow:hidden;}
  .riskBar span{display:block;height:100%;border-radius:4px;}
  .riskHigh span{background:var(--red);}
  .riskMid span{background:#b07a16;}
  .riskLow span{background:var(--green);}
  .riskCount{text-align:right;font-size:11.5px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
  .riskNote{color:var(--muted);font-size:10.5px;line-height:1.55;border-top:1px solid var(--line-2);padding-top:7px;margin-top:9px;}
  .risk-details{margin-top:8px;border-top:1px solid var(--line-2);padding-top:7px;}
  .risk-details summary{cursor:pointer;color:var(--blue);font-size:10.5px;font-weight:600;outline:none;}
  .risk-details summary:hover{text-decoration:underline;}
  .risk-details ul{margin:6px 0 0;padding-left:15px;color:var(--muted);font-size:10.4px;line-height:1.55;}
  .risk-details li{margin-bottom:4px;}
  .risk-details b{color:var(--ink-2);font-weight:600;}

  .donut-wrap{display:flex;align-items:center;gap:14px;}
  .donut{width:112px;height:112px;border-radius:50%;position:relative;flex:0 0 112px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.03);}
  .donut-hole{position:absolute;inset:19px;background:#fff;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 0 1px var(--line-2);}
  .donut-hole strong{font-size:21px;line-height:1.1;font-variant-numeric:tabular-nums;}
  .donut-hole span{font-size:9.5px;color:var(--muted);margin-top:1px;}
  .legend{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1;}
  .legend-row{display:flex;align-items:center;gap:6px;font-size:10.8px;color:var(--ink-2);}
  .legend-dot{width:8px;height:8px;border-radius:2px;flex:0 0 8px;}
  .legend-row b{margin-left:auto;font-variant-numeric:tabular-nums;}

  .priority{display:flex;flex-direction:column;gap:0;}
  .priority-row{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--line-2);cursor:pointer;}
  .priority-row:last-child{border-bottom:0;}
  .priority-row:hover{background:#f8fbfd;}
  .priority-main{flex:1;min-width:0;}
  .priority-title{font-size:11.5px;font-weight:600;line-height:1.4;color:var(--ink);}
  .priority-sub{font-size:10.2px;color:var(--muted);margin-top:1px;}
  .priority-date{font-size:10px;color:var(--muted-2);white-space:nowrap;font-variant-numeric:tabular-nums;}

  .common-list{display:flex;flex-direction:column;gap:7px;counter-reset:common;}
  .common-item{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid var(--line-2);}
  .common-item:last-child{border-bottom:0;}
  .common-no{width:20px;height:20px;flex:0 0 20px;border-radius:4px;background:var(--blue-soft);color:var(--blue);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .common-item strong{display:block;font-size:11.5px;line-height:1.4;}
  .common-item p{color:var(--muted);font-size:10.5px;line-height:1.5;margin-top:1px;}

  .table-wrap{overflow-x:auto;border:1px solid var(--line-2);border-radius:6px;}
  table{width:100%;border-collapse:collapse;font-size:11.2px;}
  th,td{text-align:left;vertical-align:top;padding:6px 7px;border-bottom:1px solid var(--line-2);}
  th{background:var(--panel-2);color:var(--ink-2);font-weight:600;font-size:10.2px;white-space:nowrap;letter-spacing:.03em;}
  td{color:var(--ink-2);line-height:1.5;}
  tbody tr:last-child td{border-bottom:0;}
  tbody tr.row-link{cursor:pointer;}
  tbody tr.row-link:hover{background:#f8fbfd;}
  .cell-project{white-space:nowrap;color:var(--ink);font-weight:600;}
  .cell-nowrap{white-space:nowrap;}
  .table-note{color:var(--muted);font-size:10.5px;margin:7px 0 0;line-height:1.5;}
  .matrix td,.matrix th{text-align:center;}
  .matrix td:first-child,.matrix th:first-child{text-align:left;}
  .matrix button.badge{border:0;cursor:pointer;}
  .matrix button.badge:hover{filter:brightness(.96);}

  .detail-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .back-link{border:0;background:none;color:var(--blue);font-size:11px;padding:0;}
  .back-link:hover{text-decoration:underline;}
  .project-switch{display:flex;gap:4px;flex-wrap:wrap;}
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:10px;}
  .detail-head h1{font-size:22px;line-height:1.3;margin:1px 0 3px;}
  .detail-sub{color:var(--muted);font-size:11.5px;}
  .detail-badges{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:flex-end;}
  .detail-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 14px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:10px 12px;margin-bottom:10px;box-shadow:var(--shadow);}
  .detail-meta span{display:block;color:var(--muted);font-size:10.2px;}
  .detail-meta strong{display:block;color:var(--ink);font-size:11.6px;font-weight:600;line-height:1.45;margin-top:1px;}
  .stage-timeline{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:12px;}
  .stage-card{background:#fff;border:1px solid var(--line);border-top:2px solid var(--line);border-radius:6px;padding:8px 9px;min-width:0;box-shadow:var(--shadow);}
  .stage-no{color:var(--muted-2);font-size:9.5px;font-variant-numeric:tabular-nums;}
  .stage-name{font-size:11px;font-weight:600;line-height:1.3;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stage-date{color:var(--muted);font-size:9.8px;margin-top:3px;font-variant-numeric:tabular-nums;}
  .stage-status{font-size:9.8px;font-weight:600;margin-top:3px;}
  .status-note{color:var(--amber);background:var(--amber-soft);border:1px solid #ead9b5;border-radius:5px;padding:6px 9px;font-size:10.5px;margin:0 0 10px;}

  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:12px 0 12px;overflow-x:auto;}
  .tab{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);padding:7px 11px;font-size:11.5px;white-space:nowrap;border-radius:4px 4px 0 0;}
  .tab:hover{color:var(--ink);background:var(--panel-2);}
  .tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:700;}

  .demo-box{border:1px dashed #b8c9d8;background:#f8fbfd;border-radius:6px;padding:9px 10px;margin:0 0 12px;}
  .demo-box-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px;}
  .demo-box-head strong{font-size:11.5px;}
  .demo-box-head span{font-size:10.2px;color:var(--muted);}
  .demo-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .demo-note{color:var(--muted);font-size:10.2px;margin-top:6px;}

  .issue-list{display:flex;flex-direction:column;gap:7px;}
  .issue-card{border:1px solid var(--line);background:#fff;border-radius:6px;padding:9px 10px;cursor:pointer;transition:border-color .14s ease,background .14s ease;}
  .issue-card:hover{border-color:#b8c9d8;background:#fbfdfe;}
  .issue-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .issue-card h4{font-size:11.6px;line-height:1.4;margin:0 0 2px;}
  .issue-meta{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-top:3px;}
  .issue-text{color:var(--muted);font-size:10.6px;line-height:1.5;margin-top:4px;}
  .mini-pill{padding:0 5px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:3px;color:var(--ink-2);font-size:9.8px;line-height:1.7;}
  .source-links{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
  .source-link{font-size:10.5px;color:var(--blue);border-bottom:1px solid #c8d8e6;padding-bottom:1px;}

  .timeline{position:relative;margin:3px 0 0 5px;padding-left:17px;}
  .timeline::before{content:"";position:absolute;left:4px;top:4px;bottom:4px;width:1px;background:var(--line);}
  .timeline-item{position:relative;padding:0 0 12px 1px;}
  .timeline-item::before{content:"";position:absolute;left:-17px;top:5px;width:8px;height:8px;border-radius:50%;background:#fff;border:1.5px solid var(--blue-2);}
  .timeline-time{color:var(--muted);font-size:10px;font-variant-numeric:tabular-nums;}
  .timeline-title{color:var(--ink);font-size:11.4px;font-weight:600;line-height:1.4;margin-top:1px;}
  .timeline-sub{color:var(--muted);font-size:10.4px;line-height:1.5;margin-top:1px;}

  .opinion{max-width:920px;}
  .opinion-status{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:9px;}
  .opinion-section{border-top:1px solid var(--line-2);padding:9px 0 2px;}
  .opinion-section:first-of-type{border-top:0;}
  .opinion-section h3{font-size:12px;color:var(--blue);margin:0 0 4px;}
  .opinion-section p{color:var(--ink-2);font-size:11.4px;line-height:1.75;margin:0 0 5px;}

  .filters{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:9px;}
  .filter-chip{border:1px solid var(--line);background:#fff;color:var(--ink-2);padding:3px 8px;font-size:10.6px;border-radius:5px;}
  .filter-chip:hover{background:var(--panel-2);}
  .filter-chip.active{background:var(--navy);border-color:var(--navy);color:#fff;}
  .select{border:1px solid var(--line);background:#fff;color:var(--ink-2);padding:4px 6px;font-size:10.7px;border-radius:5px;}

  .rule-layout{display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr);gap:11px;align-items:start;}
  .rule-list{padding:8px;max-height:calc(100vh - 230px);overflow:auto;}
  .rule-item{display:flex;gap:9px;width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:8px 9px;text-align:left;color:var(--ink);}
  .rule-item:hover{background:var(--panel-2);}
  .rule-item.active{background:var(--blue-soft);border-color:#c9d9e7;}
  .rule-item-id{font-size:10px;font-weight:700;color:var(--blue);flex:0 0 34px;padding-top:1px;}
  .rule-item-main{min-width:0;flex:1;}
  .rule-item-title{font-size:11.6px;font-weight:600;line-height:1.4;}
  .rule-item-sub{font-size:10px;color:var(--muted);margin-top:1px;}
  .rule-detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px;}
  .rule-detail-head h2{font-size:18px;line-height:1.35;margin-top:2px;}
  .detail-grid{display:grid;grid-template-columns:92px 1fr;gap:6px 12px;font-size:11.3px;line-height:1.65;}
  .detail-grid dt{color:var(--muted);}
  .detail-grid dd{margin:0;color:var(--ink-2);}
  .rule-block{border-top:1px solid var(--line-2);margin-top:11px;padding-top:10px;}

  .flow-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}
  .flow-card{background:#fff;border:1px solid var(--line);border-radius:7px;padding:10px 11px;box-shadow:var(--shadow);min-width:0;}
  .flow-top{display:flex;align-items:baseline;gap:7px;}
  .flow-no{font-size:9.8px;color:var(--blue);font-weight:700;font-variant-numeric:tabular-nums;}
  .flow-name{font-size:12px;font-weight:700;}
  .flow-block{margin-top:8px;border-left:2px solid var(--blue);padding-left:8px;}
  .flow-block.human{border-left-color:var(--amber);}
  .flow-label{font-size:9.5px;letter-spacing:.06em;color:var(--muted-2);text-transform:uppercase;}
  .flow-text{font-size:10.8px;line-height:1.55;color:var(--ink-2);margin-top:1px;}
  .flow-out{border-top:1px solid var(--line-2);margin-top:9px;padding-top:7px;font-size:10.5px;color:var(--muted);}
  .flow-out b{color:var(--ink-2);font-weight:600;}

  .banner{background:linear-gradient(90deg,var(--blue-soft),#f7fbfd);border:1px solid #cfe0ec;border-radius:7px;padding:11px 14px;font-size:12px;line-height:1.65;color:var(--ink-2);margin-bottom:12px;}
  .banner b{color:var(--blue);}

  .chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .chain-node{background:#fff;border:1px solid var(--line);border-radius:5px;padding:6px 10px;font-size:11.2px;font-weight:600;color:var(--ink);box-shadow:var(--shadow);}
  .chain-arrow{color:var(--muted-2);font-size:11px;}
  .layer-stack{display:flex;flex-direction:column;gap:7px;}
  .layer{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:7px;padding:11px 13px;box-shadow:var(--shadow);}
  .layer-label{font-size:11.5px;font-weight:700;}
  .layer-chips{display:flex;flex-wrap:wrap;gap:5px;}
  .layer-chip{background:var(--panel-2);border:1px solid var(--line-2);border-radius:4px;padding:3px 8px;font-size:10.5px;color:var(--ink-2);}
  .connector{height:12px;display:flex;align-items:center;justify-content:center;color:var(--muted-2);font-size:10px;}

  .principles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;}
  .principle{background:#fff;border:1px solid var(--line);border-radius:7px;padding:11px 12px;box-shadow:var(--shadow);}
  .principle .kicker{margin-bottom:3px;}
  .principle strong{display:block;font-size:12.5px;}
  .principle p{color:var(--muted);font-size:10.8px;line-height:1.6;margin-top:3px;}

  .arch-teaser{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:linear-gradient(120deg,#f8fbfd,#fff);}
  .arch-teaser .chips{display:flex;gap:5px;flex-wrap:wrap;}

  .drawer-backdrop{position:fixed;inset:0;background:rgba(18,35,50,.34);z-index:90;backdrop-filter:blur(1px);}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100vw);background:#fff;z-index:91;border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:-14px 0 40px rgba(20,40,60,.18);}
  .drawer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 16px 11px;border-bottom:1px solid var(--line-2);}
  .drawer-head h2{font-size:15px;line-height:1.4;margin-top:2px;}
  .drawer-close{border:0;background:none;color:var(--muted);font-size:23px;line-height:1;padding:0 2px;}
  .drawer-close:hover{color:var(--ink);}
  .drawer-body{overflow:auto;padding:13px 16px 24px;}
  .drawer-badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px;}
  .drawer-lead{font-size:12px;line-height:1.7;color:var(--ink-2);}
  .drawer-section{border-top:1px solid var(--line-2);margin-top:12px;padding-top:11px;}
  .drawer-section h3{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);margin:0 0 6px;}
  .drawer-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;padding-top:11px;border-top:1px solid var(--line-2);}
  .drawer-note{color:var(--muted);font-size:10.2px;line-height:1.55;margin-top:10px;}

  .evidence-list{display:flex;flex-direction:column;gap:5px;}
  .evidence{display:flex;align-items:flex-start;gap:7px;background:var(--panel-2);border-left:2px solid var(--blue);border-radius:0 5px 5px 0;padding:7px 9px;}
  .evidence-file{font-size:11px;font-weight:600;color:var(--ink);word-break:break-all;}
  .evidence-loc{font-size:10.8px;color:var(--muted);}
  .evidence-copy{margin-left:auto;border:0;background:none;color:var(--blue);font-size:10px;white-space:nowrap;padding:0;}

  .tour-card{position:fixed;right:18px;bottom:18px;z-index:85;width:min(374px,calc(100vw - 28px));background:#fff;border:1px solid #b8c9d8;border-top:3px solid var(--blue);border-radius:7px;padding:12px 13px 11px;box-shadow:0 14px 36px rgba(24,48,72,.20);}
  .tour-progress{height:3px;background:var(--line-2);border-radius:2px;overflow:hidden;margin:2px 0 8px;}
  .tour-progress span{display:block;height:100%;background:var(--blue);transition:width .2s ease;}
  .tour-kicker{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:10px;margin-bottom:2px;}
  .tour-kicker strong{color:var(--blue);font-size:10.2px;}
  .tour-card h3{font-size:13px;line-height:1.4;margin:0 0 3px;}
  .tour-card p{color:var(--ink-2);font-size:11px;line-height:1.6;margin:0 0 9px;}
  .tour-actions{display:flex;justify-content:space-between;gap:6px;align-items:center;}
  .tour-actions > div{display:flex;gap:5px;}
  .tour-hint{color:var(--muted-2);font-size:9.5px;}
  .tour-target{outline:3px solid var(--blue-2) !important;outline-offset:4px;box-shadow:0 0 0 7px rgba(61,128,173,.12) !important;border-radius:5px;}
  .toast{position:fixed;right:20px;bottom:20px;z-index:100;background:#1f3a52;color:#fff;padding:8px 12px;font-size:11.5px;border-radius:5px;box-shadow:0 8px 22px rgba(20,40,60,.22);max-width:380px;line-height:1.5;}
  .empty{padding:24px 12px;text-align:center;color:var(--muted);font-size:11.5px;border:1px dashed var(--line);border-radius:6px;background:var(--panel-2);}
  .muted{color:var(--muted);}
  .small{font-size:10.5px;line-height:1.5;}

  @media (max-width:1180px){
    .kpi-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
    .project-grid{grid-template-columns:1fr 1fr;}
    .grid-3{grid-template-columns:1fr 1fr;}
    .grid-3 > :last-child{grid-column:1 / -1;}
    .flow-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
    .search{width:230px;}
    .stage-timeline{grid-template-columns:repeat(4,minmax(0,1fr));}
  }
  @media (max-width:900px){
    .app{display:block;}
    .sidebar{position:static;width:100%;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px;gap:9px;}
    .batch-card{display:none;}
    .sidebar-note,.sidebar-footer{display:none;}
    .nav{flex-direction:row;flex-wrap:wrap;gap:2px;width:100%;}
    .nav-item{border-left:0;border-bottom:2px solid transparent;padding:5px 7px;font-size:11.5px;border-radius:4px 4px 0 0;}
    .nav-item.active{border-left:0;border-bottom-color:var(--blue);}
    .nav-count{display:none;}
    .topbar-inner{padding:8px 12px;flex-wrap:wrap;}
    .crumbs{flex:1 0 100%;}
    .top-actions{width:100%;flex-wrap:wrap;}
    .search{width:100%;order:3;}
    .view{padding:14px 12px 30px;}
    .project-grid{grid-template-columns:1fr;}
    .kpi-grid{grid-template-columns:1fr 1fr;}
    .grid-3,.grid-2{grid-template-columns:1fr;}
    .grid-3 > :last-child{grid-column:auto;}
    .page-head{flex-direction:column;align-items:flex-start;}
    .detail-head{flex-direction:column;}
    .detail-badges{justify-content:flex-start;}
    .detail-meta{grid-template-columns:1fr 1fr;}
    .stage-timeline{grid-template-columns:1fr 1fr;}
    .flow-grid{grid-template-columns:1fr 1fr;}
    .rule-layout{grid-template-columns:1fr;}
    .rule-list{max-height:none;}
    .principles{grid-template-columns:1fr;}
    .layer{grid-template-columns:1fr;gap:6px;}
    .batch-strip{grid-template-columns:1fr 1fr;}
    .batch-strip .strip-note{grid-column:1 / -1;border-left:0;padding-left:0;border-top:1px solid var(--line-2);padding-top:6px;}
    .drawer{width:100vw;}
  }
  @media (max-width:560px){
    .flow-grid,.kpi-grid{grid-template-columns:1fr;}
    .detail-meta{grid-template-columns:1fr;}
    .tour-card{right:10px;bottom:10px;}
    .toast{right:10px;bottom:10px;}
  }
  @media (prefers-reduced-motion:no-preference){
    .project-card,.issue-card,.kpi,.nav-item,.btn,.tab{transition:background .14s ease,border-color .14s ease,color .14s ease,transform .14s ease,box-shadow .14s ease;}
    .drawer{animation:drawerIn .18s ease;}
    @keyframes drawerIn{from{transform:translateX(26px);opacity:.5;}to{transform:translateX(0);opacity:1;}}
  }
  @media print{
    @page{size:A4 portrait;margin:11mm;}
    body{background:#fff;color:#000;font-size:9.4pt;}
    .sidebar,.topbar,.demo-box,.tour-card,.drawer,.drawer-backdrop,.toast,.no-print,.page-actions,.filters,.back-link,.tabs,.project-switch,.evidence-copy,.source-links{display:none !important;}
    .app,.main{display:block;}
    .view{max-width:none;padding:0;}
    .panel,.project-card,.kpi,.detail-meta,.detail-progress,.stage-card,.flow-card,.principle{box-shadow:none;break-inside:avoid;}
    .project-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
    .grid-3,.grid-2{grid-template-columns:1fr 1fr;}
    .flow-grid{grid-template-columns:repeat(4,minmax(0,1fr));}
    .kpi-grid{grid-template-columns:repeat(6,minmax(0,1fr));}
    a{color:#000;text-decoration:none;}
    .print-head{display:block !important;margin-bottom:8mm;}
  }
  .print-head{display:none;}

/* ---------- fiscal review additions (on top of the shared workbench CSS) ---------- */
.project-card .method-line{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.45;}
.project-card .amount-line{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin-top:2px;}
.project-card .amount-line strong{font-size:15px;font-variant-numeric:tabular-nums;}
.project-card .amount-line .arrow{color:var(--muted-2);font-size:11px;}
.project-card .amount-line .cut{color:var(--red);font-size:11px;font-weight:600;}

.ai-badge{color:var(--violet);background:var(--violet-soft);border-color:#d9d4ea;}
.decision-ok{color:var(--green);background:var(--green-soft);border-color:#cfe3d8;}
.decision-wait{color:var(--amber);background:var(--amber-soft);border-color:#ead9b5;}
.decision-no{color:var(--red);background:var(--red-soft);border-color:#eccfc8;}
.type-none{color:var(--red);background:var(--red-soft);border-color:#eccfc8;}

.amount-strong{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;}
.reduction{color:var(--red);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;}
.rate-value{color:var(--amber);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;}

.table-compact{font-size:10.7px;}
.table-compact th,.table-compact td{padding:5px 6px;line-height:1.45;}
.table-compact th{font-size:9.8px;}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
.table-total td{background:var(--panel-2);font-weight:700;color:var(--ink);}
.table-subnote{color:var(--muted);font-size:10px;line-height:1.45;margin-top:4px;}

.bar-row{display:grid;grid-template-columns:118px minmax(0,1fr) 108px;gap:9px;align-items:center;margin:8px 0;}
.bar-label{font-size:10.8px;color:var(--ink-2);line-height:1.35;}
.bar-track{height:8px;background:var(--line-2);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;background:var(--blue-2);}
.bar-fill.green{background:var(--green);}
.bar-text{font-size:10.2px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}

.qa-item{border:1px solid var(--line);background:#fff;border-radius:6px;padding:9px 10px;margin-bottom:6px;cursor:pointer;transition:background .14s ease,border-color .14s ease;}
.qa-item:hover{border-color:#b8c9d8;background:#fbfdfe;}
.qa-item.active{border-color:#b8c9d8;background:var(--blue-soft);}
.qa-q{font-size:11.6px;font-weight:600;line-height:1.45;}
.qa-a{font-size:11.4px;line-height:1.7;color:var(--ink-2);margin-top:6px;}
.cite{display:inline-block;font-size:10px;color:var(--blue);background:var(--blue-soft);border:1px solid #c9d9e7;border-radius:4px;padding:1px 6px;margin:3px 4px 0 0;line-height:1.6;}
.cite-wrap{margin-top:7px;}

.source-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
.source-card{background:#fff;border:1px solid var(--line);border-radius:7px;padding:11px 12px;box-shadow:var(--shadow);cursor:pointer;}
.source-card:hover{border-color:#b8c9d8;background:#fbfdfe;}
.source-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.source-name{font-size:11.6px;font-weight:700;}
.source-count{font-size:22px;line-height:1.2;font-weight:700;font-variant-numeric:tabular-nums;color:var(--blue);}
.source-desc{color:var(--muted);font-size:10.3px;line-height:1.5;margin-top:3px;}
.source-meta{color:var(--muted-2);font-size:9.8px;margin-top:4px;}

.version-track{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;}
.version-card{background:#fff;border:1px solid var(--line);border-top:3px solid var(--line);border-radius:7px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow);}
.version-card:hover{border-color:#b8c9d8;background:#fbfdfe;}
.version-card.active{border-color:#b8c9d8;border-top-color:var(--blue);background:var(--blue-soft);}
.version-card .v-id{font-size:10px;color:var(--muted-2);font-variant-numeric:tabular-nums;}
.version-card .v-label{font-size:11.6px;font-weight:700;margin-top:2px;}
.version-total{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25;margin-top:2px;}
.version-diff{font-size:10px;color:var(--muted);margin-top:2px;}
.comment-list{margin:0;padding-left:17px;color:var(--ink-2);font-size:10.9px;line-height:1.7;}
.comment-list li{margin-bottom:4px;}

.calc-row{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;}
.calc-step{flex:1 1 150px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;padding:8px 10px;min-width:0;}
.calc-step span{display:block;font-size:9.6px;color:var(--muted-2);letter-spacing:.04em;}
.calc-step strong{display:block;font-size:13.5px;font-variant-numeric:tabular-nums;margin-top:2px;}
.calc-step em{display:block;font-style:normal;font-size:9.8px;color:var(--muted);margin-top:2px;line-height:1.4;}

.method-strip{display:flex;gap:6px;flex-wrap:wrap;}
.method-chip{background:#fff;border:1px solid var(--line);border-radius:5px;padding:4px 9px;font-size:10.5px;color:var(--ink-2);}
.method-chip b{color:var(--blue);font-weight:600;}

.tag{display:inline-block;padding:0 5px;margin:1px 3px 1px 0;border-radius:3px;background:var(--panel-2);border:1px solid var(--line-2);color:var(--muted);font-size:9.6px;line-height:1.7;}

.drawer-amounts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px;}
.drawer-amount{background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;padding:7px 9px;}
.drawer-amount span{display:block;font-size:9.6px;color:var(--muted-2);}
.drawer-amount strong{display:block;font-size:13px;font-variant-numeric:tabular-nums;margin-top:1px;}

.fp-focus{border:1px solid #cfe0ec;background:linear-gradient(90deg,var(--blue-soft),#fbfdfe);border-radius:7px;padding:10px 12px;margin-bottom:10px;font-size:11.2px;line-height:1.65;color:var(--ink-2);}

function badge(label, tone) { return `<span class="badge tone-${esc(tone || "slate")}">${esc(label)}</span>`; }

function statusBadge(p) { return badge(p.statusLabel, p.statusTone || "blue"); }
function typeBadge(t) {
  if (!t || t === "—") return `<span class="badge tone-slate">—</span>`;
  if (String(t).indexOf("不计") === 0) return `<span class="badge tone-red">${esc(t)}</span>`;
  return `<span class="badge tone-${TYPE_TONE[t] || "slate"}">${esc(t)}</span>`;
}
function severityBadge(s) { return badge(s, s === "高" ? "red" : s === "中" ? "amber" : "slate"); }
function decisionBadge(d) {
  const tone = d === "已采纳" ? "green" : d === "已驳回" ? "red" : "amber";

}
function effectiveDecision(p, f) { return state.decisions[`${p.id}:${f.id}`] || f.decision; }

        <div class="drawer-amount"><span>待确认</span><strong style="color:var(--amber)">${waiting}</strong></div>
        <div class="drawer-amount"><span>已驳回</span><strong style="color:var(--red)">${rejected}</strong></div>

/* ------------------------------------------------------------------ function points */
function twoPointRows(p, includeOther = true) {
  const rows = p.functions.slice();
  if (includeOther) {
    const sum = (key) => rows.reduce((n, r) => n + (r[key] || 0), 0);
    rows.push({
      id: `${p.id}-OTHER`, name: `其他 ${p.fpSummary.items - p.functions.length} 项（合并后）`,
      proposedType: "—", approvedType: "—", rawFP: p.fpSummary.submittedFP - sum("rawFP"),
      firstFP: p.fpSummary.firstFP - sum("firstFP"), approvedFP: p.fpSummary.approvedFP - sum("approvedFP"),
      submittedAmount: p.submitted - sum("submittedAmount"), firstAmount: p.firstApproved - sum("firstAmount"),
      approvedAmount: p.approved - sum("approvedAmount"), adjustment: "汇总项",
      reason: "其余功能项合并/删除后的汇总，明细见项目卷宗。",
      basis: { source: "汇总", clause: "—", excerpt: "—" }, caseRef: "—",
      aiSuggestion: "—", confidence: null, decision: "—",
    });
  }
  return rows;
}
function fpFilteredRows(p) {
  let rows = p.functions.slice();
  if (p.methodKey === "two") rows = rows.concat(twoPointRows(p).filter((r) => r.id.endsWith("-OTHER")));
  if (state.filters.fpAdj !== "all") rows = rows.filter((r) => r.adjustment === state.filters.fpAdj);
  if (state.filters.fpType !== "all") rows = rows.filter((r) => r.proposedType === state.filters.fpType || r.approvedType === state.filters.fpType);
  return rows;
}
function fpSummaryCards(p) {
  return `<div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-top:0;">
    ${kpi("送审", money(p.submitted), `${p.fpSummary.submittedFP} FP`, "", "")}
    ${kpi("定稿", money(p.approved), `${p.fpSummary.approvedFP} FP`, "green", "")}
    ${kpi("审减", money(p.reduction), pct(p.rate), "warn", "")}
    ${kpi("功能项", `${p.fpSummary.items} → ${p.fpSummary.approvedItems}`, `过度拆分 ${p.fpSummary.overSplit} · 改判 ${p.fpSummary.reclass}`, "amber", "")}
  </div>`;
}
function fpPanel(p) {
  const isFive = p.methodKey === "five";
  const adjOptions = ["all", ...Array.from(new Set(p.functions.map((f) => f.adjustment)))];
  const types = isFive ? ["ILF", "EIF", "EI", "EO", "EQ"] : ["ILF", "EIF"];
  if (!adjOptions.includes(state.filters.fpAdj)) state.filters.fpAdj = "all";
  if (!["all", ...types].includes(state.filters.fpType)) state.filters.fpType = "all";
  const rows = p.functions.length ? fpFilteredRows(p) : [];
  const sums = rows.reduce((acc, r) => {
    acc.raw += r.rawFP || 0; acc.first += r.firstFP || 0; acc.approved += r.approvedFP || 0;
    acc.submitted += r.submittedAmount || 0; acc.firstAmt += r.firstAmount || 0; acc.approvedAmt += r.approvedAmount || 0;
    return acc;
  }, { raw: 0, first: 0, approved: 0, submitted: 0, firstAmt: 0, approvedAmt: 0 });
  return `<div id="fpSummary">${fpSummaryCards(p)}</div>
    <section class="panel">
      <div class="panel-head"><h2>${isFive ? "南网五点法" : "财政两点法"} · 功能点审核</h2><span class="hint">${esc(p.fpSummary.unit)}</span></div>
      <div class="filters">
        <select class="select" data-select="fpAdj" aria-label="调整类型"><option value="all">全部调整类型</option>${adjOptions.filter((a) => a !== "all").map((a) => `<option value="${esc(a)}" ${state.filters.fpAdj === a ? "selected" : ""}>${esc(a)}</option>`).join("")}</select>
        <button class="filter-chip ${state.filters.fpType === "all" ? "active" : ""}" data-filter="fpType" data-value="all">全部类型</button>
        ${types.map((t) => `<button class="filter-chip ${state.filters.fpType === t ? "active" : ""}" data-filter="fpType" data-value="${t}">${t}</button>`).join("")}
        <span class="small muted" style="margin-left:4px;">${rows.length} 行</span>
      </div>
      ${isFive ? fivePointTable(p, rows, sums) : twoPointTable(p, rows, sums)}
      <p class="table-note">${isFive ? "五点法：功能点 × 权重 → 调整 FP（×1.39）→ 人天 → 2600 元/人天；参数为演示值，可按客户规则配置。" : "两点法：只计 ILF / EIF（可研权重 ILF 35 / EIF 15）；报表、统计、适配等事务功能不计。关键词判类不可靠，要回标准定义 + 历史案例。金额 = 功能点 × 综合单价（演示值）。"}</p>
    </section>`;
}
function twoPointTable(p, rows, sums) {
  return `<div class="table-wrap"><table class="table-compact" id="fpTable"><thead><tr><th>编号</th><th>功能项</th><th>送审类型</th><th>审定类型</th><th class="num">送审 FP</th><th class="num">审定 FP</th><th class="num">送审</th><th class="num">初稿</th><th class="num">定稿</th><th class="num">审减</th><th>调整原因</th><th>AI 建议 / 决策</th></tr></thead><tbody>
    ${rows.map((r) => { const other = r.id.endsWith("-OTHER"); return `<tr class="${other ? "" : "row-open"}" ${other ? "" : `data-open-fp="${p.id}|${r.id}"`}>
      <td class="cell-nowrap">${esc(r.id)}</td><td><strong>${esc(r.name)}</strong><div class="small muted">${esc(r.desc || "")}</div></td>
      <td class="cell-nowrap">${typeBadge(r.proposedType)}</td><td class="cell-nowrap">${typeBadge(r.approvedType)}</td>
      <td class="num">${num(r.rawFP)}</td><td class="num">${num(r.approvedFP)}</td>
      <td class="num">${money(r.submittedAmount)}</td><td class="num">${money(r.firstAmount)}</td><td class="num amount-strong">${money(r.approvedAmount)}</td>
      <td class="num reduction">${cutText((r.submittedAmount || 0) - (r.approvedAmount || 0))}</td>
      <td>${esc(r.adjustment)}</td>
      <td class="cell-nowrap">${r.aiSuggestion && r.aiSuggestion !== "—" ? `<span class="badge ai-badge">AI · ${esc(r.aiSuggestion)}</span>` : "—"} ${r.decision !== "—" ? decisionBadge(effectiveDecision(p, r)) : ""}</td>
    </tr>`; }).join("")}
    <tr class="table-total"><td colspan="4">筛选合计</td><td class="num">${num(sums.raw)}</td><td class="num">${num(sums.approved)}</td><td class="num">${money(sums.submitted)}</td><td class="num">${money(sums.firstAmt)}</td><td class="num">${money(sums.approvedAmt)}</td><td class="num reduction">${cutText(sums.submitted - sums.approvedAmt)}</td><td colspan="2">${state.filters.fpAdj === "all" && state.filters.fpType === "all" ? "与项目合计一致" : "当前筛选结果"}</td></tr>
  </tbody></table></div>`;
}
function fivePointTable(p, rows, sums) {

    id: c.id, name: c.name, spec: c.spec, qty: c.qty, unit: c.unit,

    adjustment: c.adjustment, basis: c.basis,
  }));
}
function auditTable(p) {
  const rows = auditRows(p);

      ${rows.map((r, i) => { const other = r.id.endsWith("-OTHER"); return `<tr class="${other ? "" : "row-open"}" ${other ? "" : (isFp ? `data-open-fp="${p.id}|${r.id}"` : `data-open-cost="${p.id}|${r.id}"`)}><td class="cell-nowrap">${i + 1}</td><td><strong>${esc(r.name)}</strong>${r.spec ? `<div class="small muted">${esc(r.spec)}</div>` : ""}</td><td class="num">${money(r.submittedAmount)}</td><td class="num">${money(r.firstAmount)}</td><td class="num amount-strong">${money(r.approvedAmount)}</td><td class="num reduction">${cutText((r.submittedAmount || 0) - (r.approvedAmount || 0))}</td><td class="num">${r.submittedAmount ? pct((r.submittedAmount - r.approvedAmount) / r.submittedAmount * 100) : "—"}</td><td class="small">${esc((r.basis && (r.basis.clause || r.basis.source)) || r.adjustment || "—")}</td></tr>`; }).join("")}
      <tr class="table-total"><td colspan="2">合计</td><td class="num">${money(total.s)}</td><td class="num">${money(total.f)}</td><td class="num">${money(total.d)}</td><td class="num reduction">${cutText(total.s - total.d)}</td><td class="num">${pct((total.s - total.d) / total.s * 100)}</td><td>—</td></tr>

  state.drawer = { kind, id };
  renderDrawer();

  $("#drawer").hidden = false;
  $("#drawer").setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
  setTimeout(() => { const b = $("#drawerClose"); if (b) b.focus(); }, 20);
}
function closeDrawer() {
  state.drawer = null;

  $("#drawer").hidden = true;

function drawerEvidence(ev) {

}

      <div class="drawer-section"><h3>调整原因</h3><div style="font-size:11.4px;line-height:1.65;color:var(--ink-2);">${esc(f.reason)}</div></div>
      ${drawerEvidence(f.basis)}

      <div class="drawer-section"><h3>AI 建议</h3><div style="font-size:11.4px;line-height:1.65;color:var(--ink-2);">${esc(f.aiSuggestion || "—")}${f.confidence != null ? ` · 置信度 ${Math.round(f.confidence * 100)}%` : ""}</div><div class="small muted" style="margin-top:3px;">AI 只给建议；采纳/驳回由评审人操作，驳回后转人工复核，不自动改金额。</div></div>
      <div class="drawer-actions">${decision !== "已采纳" ? `<button class="btn btn-primary" data-action="accept-ai" data-project="${p.id}" data-fp="${f.id}">采纳建议</button>` : ""}${decision !== "已驳回" ? `<button class="btn" data-action="reject-ai" data-project="${p.id}" data-fp="${f.id}">驳回建议</button>` : ""}<button class="btn" data-action="close-drawer">关闭</button></div>

  } else if (d.kind === "cost") {

    body = `<div class="drawer-badges">${badge(c.adjustment, "amber")}${badge(p.category, "slate")}</div>
      <p class="drawer-lead">${esc(c.spec)} · ${c.qty} ${esc(c.unit)} × ${num(c.unitPrice)} 万</p>
      <div class="drawer-amounts"><div class="drawer-amount"><span>送审</span><strong>${money(c.submitted)}</strong></div><div class="drawer-amount"><span>初稿</span><strong>${money(c.firstAmount)}</strong></div><div class="drawer-amount"><span>定稿</span><strong>${money(c.approvedAmount)}</strong></div><div class="drawer-amount"><span>审减</span><strong class="reduction">${cutText(c.submitted - c.approvedAmount)}</strong></div></div>
      <div class="drawer-section"><h3>价格来源</h3><div style="font-size:11.4px;line-height:1.65;color:var(--ink-2);">${esc(c.priceSource)}</div></div>
      <div class="drawer-section"><h3>调整原因</h3><div style="font-size:11.4px;line-height:1.65;color:var(--ink-2);">${esc(c.reason)}</div></div>
      ${drawerEvidence(c.basis)}
      <div class="drawer-actions"><button class="btn" data-action="close-drawer">关闭</button></div>
      <p class="drawer-note">费用审核以采购网/合同/历史价为依据；合同缺页、范围外服务先补正再审定。</p>`;

  } else if (d.kind === "kb") {

  }
  $("#drawerKicker").textContent = kicker;
  $("#drawerTitle").textContent = title;
  $("#drawerBody").innerHTML = body;
}

/* ------------------------------------------------------------------ routes */
let lastRoute = "";
function parseRoute() {
  const raw = location.hash.replace(/^#\/?/, "");
  if (!raw) return { name: "overview" };
  const parts = raw.split("/");
  if (parts[0] === "project" && parts[1]) return { name: "project", id: parts[1].toUpperCase(), tab: parts[2] || "overview" };
  if (["fp", "cost", "audit"].includes(parts[0])) return { name: parts[0], id: (parts[1] || (parts[0] === "fp" ? "A" : parts[0] === "cost" ? "B" : "A")).toUpperCase() };
  return { name: parts[0] || "overview" };
}
function setCrumbs(route) {
  let text = "批次总览";
  if (route.name === "projects") text = "项目卷宗";
  if (route.name === "fp") text = `功能点审核 / 项目 ${route.id}`;
  if (route.name === "cost") text = `费用审核 / 项目 ${route.id}`;
  if (route.name === "tech") text = "技术评审";
  if (route.name === "kb") text = "知识库";
  if (route.name === "audit") text = `审定表 / 项目 ${route.id}`;
  if (route.name === "arch") text = "架构";
  if (route.name === "tour") text = "演示导览";
  if (route.name === "project") {
    const p = projectById(route.id);
    const tabs = { overview: "概览", materials: "材料", detail: p && p.functions.length ? "功能点" : "费用明细", tech: "技术评审", versions: "版本", audit: "审定表" };
    text = `项目卷宗 / <b>${esc(p ? p.name : route.id)}</b> / ${tabs[route.tab] || "概览"}`;
  }
  $("#crumbs").innerHTML = text;
}
function setActiveNav(route) {
  const active = route.name === "project" ? "projects" : route.name;
  $$(".nav-item").forEach((el) => el.classList.toggle("active", el.dataset.nav === active));
}
function render() {
  const route = parseRoute();
  const routeKey = location.hash || "#/overview";
  const changed = routeKey !== lastRoute;
  lastRoute = routeKey;
  if (changed && state.drawer) closeDrawer();
  setActiveNav(route);
  setCrumbs(route);
  let html = "";
  if (route.name === "projects") html = renderProjects();
  else if (route.name === "fp") html = fpView(route.id);
  else if (route.name === "cost") html = costView(route.id);
  else if (route.name === "tech") html = renderTech();
  else if (route.name === "kb") html = renderKB();
  else if (route.name === "audit") html = renderAudit(route.id);
  else if (route.name === "arch") html = renderArch();
  else if (route.name === "tour") html = renderTourPage();
  else if (route.name === "project") html = renderProject(route.id, route.tab);
  else html = renderOverview();
  $("#view").innerHTML = html;
  $("#demoPill").hidden = !demoChanged();
  applyTourHighlight();
  if (changed && !state.tour.active) window.scrollTo({ top: 0, behavior: "auto" });
}

    <div class="filters">${DATA.projects.filter((x) => x.costItems.length).map((x) => `<button class="filter-chip ${x.id === p.id ? "active" : ""}" data-go="cost/${x.id}">项目 ${x.id}</button>`).join("")}<span class="small muted" style="margin-left:4px;">${esc(p.method)}</span></div>

/* ------------------------------------------------------------------ search */
function closeSearch() { const b = $("#searchResults"); if (b) { b.hidden = true; b.innerHTML = ""; } }
function renderSearch(q) {
  const box = $("#searchResults");
  const query = q.trim().toLowerCase();
  if (!query) { box.hidden = true; box.innerHTML = ""; return; }
  const results = [];
  DATA.projects.forEach((p) => {
    if (`${p.name} ${p.client} ${p.category} ${p.method} ${p.id}`.toLowerCase().includes(query)) results.push({ type: "项目", label: p.name, sub: `${p.id} · ${p.client} · ${p.statusLabel}`, attr: `data-go="project/${p.id}/overview"` });
    (p.functions || []).forEach((f) => { if (`${f.name} ${f.desc} ${f.id}`.toLowerCase().includes(query)) results.push({ type: "功能点", label: `${p.id} · ${f.name}`, sub: `${f.proposedType} → ${f.approvedType} · ${f.adjustment}`, attr: `data-go="fp/${p.id}"` }); });
    (p.costItems || []).forEach((c) => { if (`${c.name} ${c.spec} ${c.id}`.toLowerCase().includes(query)) results.push({ type: "费用", label: `${p.id} · ${c.name}`, sub: `${c.adjustment} · ${money(c.submitted)} → ${money(c.approvedAmount)}`, attr: `data-go="cost/${p.id}"` }); });
  });
  (DATA.knowledge.entries || []).forEach((e) => { if (`${e.title} ${e.type} ${e.tags.join(" ")}`.toLowerCase().includes(query)) results.push({ type: "知识", label: e.title, sub: `${e.type} · ${e.source}`, attr: `data-go="kb"` }); });
  (DATA.knowledge.qa || []).forEach((x) => { if (`${x.q} ${x.a}`.toLowerCase().includes(query)) results.push({ type: "问答", label: x.q, sub: "知识库问答", attr: `data-go="kb"` }); });
  if (!results.length) { box.innerHTML = `<div class="search-empty">没有找到匹配内容。</div>`; box.hidden = false; return; }
  box.innerHTML = results.slice(0, 12).map((r) => `<button class="search-result" ${r.attr}><span class="badge tone-slate" style="margin-right:4px;">${r.type}</span>${esc(r.label)}<small>${esc(r.sub)}</small></button>`).join("");
  box.hidden = false;
}

/* ------------------------------------------------------------------ toast / actions */
function toast(msg) { const el = $("#toast"); el.textContent = msg; el.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => { el.hidden = true; }, 2600); }
function goTo(path) { closeSearch(); if (state.drawer) closeDrawer(); const h = "#/" + path; if (location.hash === h) render(); else location.hash = h; }
function handleAction(action, el) {
  if (action === "start-tour") return startTour();
  if (action === "next-tour") return nextTour();
  if (action === "prev-tour") return prevTour();
  if (action === "exit-tour") return exitTour(false);
  if (action === "close-drawer") return closeDrawer();
  if (action === "print") { try { window.print(); } catch (e) { toast("当前预览环境不支持打印；请在浏览器中打开后打印。"); } return; }
  if (action === "reset-demo") return resetDemo();
  if (action === "accept-ai" || action === "reject-ai") {
    const key = `${el.dataset.project}:${el.dataset.fp}`;
    state.decisions[key] = action === "accept-ai" ? "已采纳" : "已驳回";
    closeDrawer(); render(); toast(action === "accept-ai" ? "已采纳 AI 建议（演示）。" : "已驳回，转人工复核（演示）。"); return;
  }
  if (action === "close-tech") {
    state.techStatus[el.dataset.tech] = "已闭环";
    closeDrawer(); render(); toast("技术问题已标记闭环（演示）。"); return;
  }
}
function resetDemo() {
  state.decisions = {}; state.techStatus = {};
  state.filters = { fpAdj: "all", fpType: "all", techProject: "all", techSeverity: "all" };
  state.tour.active = false; $("#tourCard").hidden = true; state.kbQ = 0; state.version = {};
  closeDrawer(); closeSearch(); goTo("overview"); toast("已恢复初始演示状态。");
}

/* ------------------------------------------------------------------ tour */
function startTour() { closeDrawer(); state.tour.active = true; state.tour.step = 0; goTourStep(); }
function goTourStep() {
  const step = TOUR[state.tour.step];
  if (!step) return exitTour(false);
  goTo(step.route);
  setTimeout(() => {
    const el = document.querySelector(step.target);
    if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
    updateTourCard(); applyTourHighlight();
  }, 160);
}
function updateTourCard() {
  const step = TOUR[state.tour.step];
  if (!step) return;
  $("#tourCard").hidden = false;
  $("#tourStepLabel").textContent = `${state.tour.step + 1} / ${TOUR.length}`;
  $("#tourProgress").style.width = `${(state.tour.step + 1) / TOUR.length * 100}%`;
  $("#tourTitle").textContent = step.title;
  $("#tourText").textContent = step.text;
  $("#tourNext").textContent = state.tour.step === TOUR.length - 1 ? "完成" : "下一步";
  $("#tourPrev").disabled = state.tour.step === 0;
}
function nextTour() { if (!state.tour.active) return; if (state.tour.step >= TOUR.length - 1) return exitTour(true); state.tour.step += 1; goTourStep(); }
function prevTour() { if (!state.tour.active || state.tour.step === 0) return; state.tour.step -= 1; goTourStep(); }
function exitTour(done) {
  state.tour.active = false; $("#tourCard").hidden = true;
  $$(".tour-target").forEach((el) => el.classList.remove("tour-target"));
  if (done) toast("导览完成。可点击任意项目继续查看。");
}
function applyTourHighlight() {
  $$(".tour-target").forEach((el) => el.classList.remove("tour-target"));
  if (!state.tour.active) return;
  const step = TOUR[state.tour.step];
  const el = step ? document.querySelector(step.target) : null;
  if (el) el.classList.add("tour-target");
}

/* ------------------------------------------------------------------ events */
document.addEventListener("click", (e) => {
  const actionEl = e.target.closest("[data-action]");
  if (actionEl) { e.preventDefault(); handleAction(actionEl.dataset.action, actionEl); return; }
  const go = e.target.closest("[data-go]");
  if (go) { e.preventDefault(); closeSearch(); goTo(go.dataset.go); return; }
  const fp = e.target.closest("[data-open-fp]");
  if (fp) { e.preventDefault(); openDrawer("fp", fp.dataset.openFp); return; }
  const cost = e.target.closest("[data-open-cost]");
  if (cost) { e.preventDefault(); openDrawer("cost", cost.dataset.openCost); return; }
  const tech = e.target.closest("[data-open-tech]");
  if (tech) { e.preventDefault(); openDrawer("tech", tech.dataset.openTech); return; }
  const kb = e.target.closest("[data-open-kb]");
  if (kb) { e.preventDefault(); openDrawer("kb", kb.dataset.openKb); return; }
  const qa = e.target.closest("[data-qa]");
  if (qa) { e.preventDefault(); state.kbQ = Number(qa.dataset.qa); render(); return; }
  const ver = e.target.closest("[data-version]");
  if (ver) { e.preventDefault(); state.version[ver.dataset.project] = ver.dataset.version; render(); return; }
  const filter = e.target.closest("[data-filter]");
  if (filter) { e.preventDefault(); closeSearch(); state.filters[filter.dataset.filter] = filter.dataset.value; render(); return; }
  if (!e.target.closest(".search")) closeSearch();
});
document.addEventListener("change", (e) => {
  const sel = e.target.closest("[data-select]");
  if (!sel) return;
  if (sel.dataset.select === "fpAdj") state.filters.fpAdj = sel.value;
  render();
});
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if ((e.key === "Enter" || e.key === " ") && t && t.matches && t.matches('[role="button"][data-go], [role="button"][data-open-fp], [role="button"][data-open-cost], [role="button"][data-open-tech], [role="button"][data-open-kb], [role="button"][data-qa]')) {
    e.preventDefault(); t.click(); return;
  }
  if (e.key === "Escape") { if (state.drawer) closeDrawer(); else closeSearch(); if (state.tour.active) exitTour(false); return; }
  if (state.tour.active && (e.key === "ArrowRight" || e.key === "ArrowLeft")) { e.preventDefault(); if (e.key === "ArrowRight") nextTour(); else prevTour(); return; }
  if (e.key === "/" && document.activeElement && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) { e.preventDefault(); $("#globalSearch").focus(); }
});
$("#drawerClose").addEventListener("click", closeDrawer);
$("#drawerBackdrop").addEventListener("click", closeDrawer);
$("#globalSearch").addEventListener("input", (e) => renderSearch(e.target.value));
$("#globalSearch").addEventListener("focus", (e) => { if (e.target.value) renderSearch(e.target.value); });
window.addEventListener("hashchange", () => { render(); });
render();

</script>
</body>
</html>
